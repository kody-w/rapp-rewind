name: Native macOS CI

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native checks (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          set-safe-directory: false

      - name: Ensure XcodeGen is available
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
          swift --version
          xcodebuild -version

      - name: Run safe native and compatibility checks
        env:
          REWIND_CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./tools/native-ci.sh "${{ matrix.arch }}"

      - name: Upload test logs, not release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-checks-${{ matrix.arch }}
          path: native/.build/ci-logs/
          if-no-files-found: warn
          retention-days: 14
